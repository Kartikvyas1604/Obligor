[package]
name = "obligor-enclave"
version = "0.1.0"
edition = "2021"

# Self-contained: not part of the repo-root Cargo workspace (which only holds
# the Anchor program), so `anchor build` never tries to compile the enclave.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
