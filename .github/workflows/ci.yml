name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (margin engine, rate limiter, session store, escrow math)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Demo Law smoke — agent scripts reach 402 → paid → 200 against the built server
        run: |
          npx next start -p 3000 &
          sleep 5
          DEMO_ALLOW_FIXTURES=true DEMO_ALLOW_UNPAID=true npx -y tsx scripts/demo-agent-a.ts
          npx -y tsx scripts/demo-agent-b.ts

  # Compiled-artifact claims become checkable: the Arcis circuit, Rust
  # enclave, and Solidity escrow contract must not just exist but build.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            enclave/obligor-enclave/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('enclave/obligor-enclave/Cargo.toml') }}

      - name: Build + typecheck the TEE enclave (honest attestation shape)
        run: cargo build --locked 2>/dev/null || cargo build
        working-directory: enclave/obligor-enclave

      - name: Install Foundry (forge)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build the Solidity escrow contract (checks, access control, AST warnings)
        run: forge build --contracts contracts/ObligorEscrow.sol

  # Arcium program directory is Arcis/Anchor + toolchain dependent; compiles
  # once the arcium CLI is pinned — tracked as a CI follow-up in README.
