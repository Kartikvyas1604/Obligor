name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan — production deps (fail on high/critical)
        # Scans shipped dependencies. Dev-only advisories (eslint toolchain) are
        # tracked out-of-band and must not block a deploy of the runtime app.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (margin engine, rate limiter, session store, escrow math)
        run: npm test

      - name: Schema migration smoke (idempotent, sqlite)
        env:
          SESSION_STORE_MODE: sqlite
          SQLITE_PATH: /tmp/ci-obligor.db
        run: |
          npm run migrate
          npm run migrate   # must be a safe no-op on re-run

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Demo Law smoke + endpoint security contract
        # A clean checkout has no .env, so the x402 destination and the demo
        # escape hatches must be supplied explicitly — otherwise the challenge
        # is unconfigured and the smoke fails closed (503), which is correct
        # behavior but not what the agents assert.
        env:
          SOLANA_PAY_TO: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
          X402_ACCEPT_UNVERIFIED_SIGNATURES: "true"
          DEMO_ALLOW_FIXTURES: "true"
          DEMO_ALLOW_UNPAID: "true"
          NEXT_PUBLIC_API_BASE: http://localhost:3000
        run: |
          npx next start -p 3000 &
          sleep 6
          npx -y tsx scripts/demo-agent-a.ts
          npx -y tsx scripts/demo-agent-b.ts
          npm run verify:security

  # The container is the deploy artifact: prove the Dockerfile builds and the
  # image boots and answers a health check, on every PR — not only at release.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t obligor:ci .

      - name: Boot the image and assert /health
        run: |
          docker run -d --name obligor-ci -p 3000:3000 \
            -e SOLANA_PAY_TO=7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU \
            obligor:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health >/tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          cat /tmp/health.json || true
          docker logs obligor-ci || true
          docker rm -f obligor-ci
          test "$ok" = "1"
          grep -q '"ok":true' /tmp/health.json

  # Compiled-artifact claims become checkable: the Arcis circuit, Rust
  # enclave, Anchor program, and Solidity escrow contract must not just exist
  # but build.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            enclave/obligor-enclave/target
            target
            mxe/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('enclave/obligor-enclave/Cargo.toml', 'mxe/Cargo.toml', 'programs/obligor-escrow/Cargo.toml') }}

      - name: Build + typecheck the TEE enclave (honest attestation shape)
        run: cargo build --locked 2>/dev/null || cargo build
        working-directory: enclave/obligor-enclave

      - name: Build + unit-test the Anchor escrow program (release-split math)
        run: |
          cargo build --manifest-path programs/obligor-escrow/Cargo.toml
          cargo test  --manifest-path programs/obligor-escrow/Cargo.toml

      - name: Build + test the Arcium/Arcis MXE circuit crate
        run: |
          cargo build --manifest-path mxe/Cargo.toml
          cargo test  --manifest-path mxe/Cargo.toml
          cargo build --manifest-path mxe/Cargo.toml --features anchor

      - name: Install Foundry (forge)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build + test the Solidity escrow contract (custody + access control)
        run: |
          forge build
          forge test -vv

  # The on-chain claim ("a deployable program") is only real if the SBF
  # artifact is produced. Installs the pinned Anchor + Agave toolchain, runs
  # `anchor build`, and asserts the .so + IDL exist.
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Agave (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI (matches Anchor.toml anchor_version)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 1.1.2
          avm use 1.1.2

      - name: anchor build
        run: anchor build

      - name: Assert SBF artifact + IDL exist
        run: |
          test -f target/deploy/obligor_escrow.so
          test -f target/idl/obligor_escrow.json
