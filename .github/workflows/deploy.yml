name: Deploy (container)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t obligor:${{ github.sha }} .

      - name: Smoke the image — boots and answers /health
        run: |
          docker run -d --name obligor-smoke -p 3000:3000 \
            -e SOLANA_PAY_TO=7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU \
            obligor:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/v1/health >/tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          docker rm -f obligor-smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag obligor:${{ github.sha }} $IMAGE:${GITHUB_SHA::12}
          docker tag obligor:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::12}
          docker push $IMAGE:latest
