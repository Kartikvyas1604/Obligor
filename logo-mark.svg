<svg width="48" height="32" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bright Gold Gradient (Top Pill) -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C874" />
      <stop offset="50%" stop-color="#C59A3F" />
      <stop offset="100%" stop-color="#A67C27" />
    </linearGradient>
    <!-- Muted Bronze Gradient (Bottom Pill) -->
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E5C3D" />
      <stop offset="50%" stop-color="#4A3D25" />
      <stop offset="100%" stop-color="#312818" />
    </linearGradient>
  </defs>
  
  <!-- Bottom Muted Pill (Offset Right) -->
  <rect x="12" y="16" width="36" height="16" rx="8" fill="url(#gold-dark)" />
  
  <!-- Top Bright Pill (Offset Left) -->
  <rect x="0" y="0" width="36" height="16" rx="8" fill="url(#gold-bright)" />
</svg>