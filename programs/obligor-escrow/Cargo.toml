[package]
name = "obligor-escrow"
version = "0.1.0"
description = "Obligor bilateral margin escrow — locks desk collateral and releases excess on a verified netting result"
edition = "2021"

[lib]
name = "obligor_escrow"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Pinned to the 0.30.x line to match the JS ecosystem (`@coral-xyz/anchor`
# client tops out at 0.32.1; 1.x uses a different IDL spec). The settle
# instruction is built with @solana/web3.js directly, so this pin only governs
# the on-chain program + its IDL.
anchor-lang = "=0.30.1"
anchor-spl = { version = "=0.30.1", features = ["token"] }
