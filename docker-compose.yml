services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: obligor:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      # sqlite survives restarts and is safe for multiple processes on one
      # volume. Leave the default (file) for single-instance, or set sqlite.
      SESSION_STORE_MODE: sqlite
      SQLITE_PATH: /data/obligor.db
      # Payments: set a real destination to enable the x402 challenge.
      SOLANA_PAY_TO: ${SOLANA_PAY_TO:-}
      # Secret-free defaults. demo escape hatches stay OFF in production.
    volumes:
      - obligor-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  obligor-data:
