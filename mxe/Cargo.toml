# NOTE: obligor-mxe is an Arcium/Arcis MXE circuit, not a native Anchor
# program. It lives outside programs/ (see /Cargo.toml exclude) so `anchor build`
# never picks it up, and it is intentionally NOT a member of the root workspace.
# The real confidential artifact is encrypted-ixs/two_party_portfolio_net.rs.
[package]
name = "obligor-mxe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
