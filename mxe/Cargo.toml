# NOTE: obligor-mxe is an Arcium/Arcis MXE circuit, not a native Anchor
# program — it is intentionally NOT a member of the root workspace (see
# /Cargo.toml). This manifest exists only so the Anchor workspace scanner can
# enumerate the directory; the crate is never built by `anchor build` because
# it is not listed under [programs.*] in Anchor.toml.
[package]
name = "obligor-mxe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
