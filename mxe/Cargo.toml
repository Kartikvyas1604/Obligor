# obligor-mxe is the Arcium / Arcis MXE circuit crate for Obligor's confidential
# two-party portfolio netting. It lives outside programs/ (see /Cargo.toml
# exclude) so `anchor build` never picks it up, and is intentionally NOT a member
# of the root workspace.
#
# `cargo build` / `cargo test` compile the Arcis circuit source with zero
# dependencies, so the integer mirror of lib/margin.ts is unit-tested natively.
# `--features anchor` additionally builds the Anchor program skeleton; a
# production MXE deployment runs `arcium init` which replaces #[program] with
# #[arcium_program] and wires the MXE queue/callback instructions.
[package]
name = "obligor-mxe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Arcis confidential circuit + Anchor skeleton: two-party portfolio netting"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
anchor = ["dep:anchor-lang"]

[dependencies]
anchor-lang = { version = "0.30.1", optional = true }
